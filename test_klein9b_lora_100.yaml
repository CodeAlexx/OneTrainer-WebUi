# Serenity Klein 9B LoRA 100-step Test
# Dataset: eri2 (118 images)

model_type: flux_2_klein_9b_base

model:
  path: /home/alex/.cache/huggingface/hub/models--black-forest-labs--FLUX.2-klein-base-9B/snapshots/17c3b160520b7dd44665dbf0b9ed9dd30c15cd06
  dtype: bfloat16

adapter:
  type: lora
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_modules: []

memory:
  strategy: noop
  gradient_checkpointing: "cpu_offloaded"
  layer_offload_fraction: 0.7

data:
  concepts:
    - /home/alex/eri2
  cache_dir: /home/alex/OneTrainer/workspace/klein9b_100_cache
  resolution: 1024
  batch_size: 1
  num_workers: 4

sample:
  enabled: true
  interval: 50
  interval_unit: step
  sample_at_start: false
  sample_at_end: true
  prompts:
    - "a beautiful woman, photorealistic portrait"
  seeds:
    - 42
  num_inference_steps: 28
  guidance_scale: 3.5
  width: 1024
  height: 1024

checkpoint:
  output_dir: /home/alex/OneTrainer/output/klein9b_lora_100
  save_every: 100
  save_every_unit: step
  keep_last_export: 2

logging:
  enable_tensorboard: false
  enable_wandb: false
  log_interval: 10

learning_rate: 1.0e-4
epochs: 1
gradient_accumulation: 1

output_dir: /home/alex/OneTrainer/output/klein9b_lora_100

seed: 42
