# SD3.5 Medium Test - 10 steps with sampling
model_type: sd3.5

model:
  path: stabilityai/stable-diffusion-3.5-medium
  dtype: bfloat16
  skip_text_encoder_3: true

data:
  concepts:
    - /home/alex/eri2
  resolution: 512  # Small for fast test
  batch_size: 1
  caption_source: txt

adapter:
  type: lora
  rank: 16
  alpha: 16
  target_modules:
    - transformer

memory:
  gradient_checkpointing: "on"

optimizer:
  optimizer: adamw

scheduler:
  scheduler: constant

learning_rate: 0.0001
epochs: 1
gradient_accumulation: 1

# Enable sampling
sample:
  enabled: true
  interval: 5
  interval_unit: step
  sample_at_start: true
  num_inference_steps: 10
  guidance_scale: 5.0
  width: 512
  height: 512
  prompts:
    - "a photograph of a cat, high quality"
  seeds:
    - 42

checkpoint:
  save_every: 100
  save_every_unit: step
  output_dir: output/sd35_sample_test
seed: 42
