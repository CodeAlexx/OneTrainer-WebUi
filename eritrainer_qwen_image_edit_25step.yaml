# EriTrainer Qwen Image Edit 25-step Test
# Tests gradient checkpointing + activation offloading + sampling

# Model type at top level
model_type: qwen_image_edit

# Model configuration
model:
  path: /home/alex/.cache/huggingface/hub/models--Qwen--Qwen-Image/snapshots/75e0b4be04f60ec59a75f475837eced720f823b6
  dtype: bfloat16

# Adapter (LoRA) configuration
adapter:
  type: lora
  rank: 16
  alpha: 16.0

# Memory optimization (critical for 24GB VRAM)
# NOTE: Qwen Image transformer is 20.4B params - needs quantization!
# int8 used (fp8 requires H100/H200 compute capability 9.0+)
memory:
  gradient_checkpointing: cpu_offloaded
  enable_activation_offloading: true
  layer_offload_fraction: 0.5  # 50% offload for 20B model (19GB int8 → ~9.5GB on GPU)
  quantization: int8  # int8 quantization (works on all CUDA GPUs)

# Data configuration
data:
  concepts:
    - /home/alex/eri2
  resolution: 512
  batch_size: 1
  edit_mode: false  # Text-to-image mode (no control images)

# Sampling configuration
sample:
  enabled: true
  interval: 25
  interval_unit: step
  prompts:
    - "a woman with blonde hair, professional photo"
  width: 256
  height: 256
  num_inference_steps: 20
  guidance_scale: 1.0

# Training hyperparameters
learning_rate: 1.0e-4
epochs: 1
gradient_accumulation: 1

# Checkpoint configuration
checkpoint:
  output_dir: /home/alex/OneTrainer/output/qwen_edit_test
  save_every: 9999  # Don't save during short test
  backup_every: 9999

# Output
output_dir: /home/alex/OneTrainer/output/qwen_edit_test

# Reproducibility
seed: 42
