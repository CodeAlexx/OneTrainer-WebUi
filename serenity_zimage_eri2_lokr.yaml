# Serenity Z-Image LoKR Training
# Dataset: eri2 (118 images)
# Run: python -m serenity --config serenity_zimage_eri2_lokr.yaml

# Model type for adapter target modules
model_type: zimage

# Model configuration
model:
  path: /home/alex/.cache/huggingface/hub/models--Tongyi-MAI--Z-Image-Turbo/snapshots/78771b7e11b922c868dd766476bda1f4fc6bfc96
  dtype: bfloat16
  variant: base

# LoKR adapter configuration
adapter:
  type: lokr
  rank: 16
  alpha: 16.0
  dropout: 0.0
  # LyCORIS LoKR-specific settings
  lokr_factor: 8
  lokr_decompose_both: true
  lokr_full_matrix: false
  use_tucker: false
  # Target modules (empty = auto-detect for zimage)
  target_modules: []

# Memory optimization
memory:
  strategy: noop
  gradient_checkpointing: "cpu_offloaded"
  layer_offload_fraction: 0.0

# Data configuration
data:
  concepts:
    - /home/alex/eri2
  cache_dir: zimage_eri2_workspace/cache_eri
  resolution: 1024
  batch_size: 1
  num_workers: 4

# Sample generation
sample:
  enabled: true
  interval: 100
  interval_unit: step
  prompts:
    - "a beautiful woman with elegant features, soft natural lighting, professional portrait photography"
    - "cinematic portrait of a woman in golden hour light, shallow depth of field, photorealistic"
    - "a woman standing in a city street at night, neon lights reflecting, urban photography style"
    - "close-up portrait of a woman with dramatic studio lighting, black background, high contrast"
    - "a woman relaxing in a cozy cafe, warm ambient lighting, lifestyle photography, candid moment"
  seeds:
    - 42
  num_inference_steps: 28
  guidance_scale: 3.5
  width: 1024
  height: 1024

# Checkpoint configuration
checkpoint:
  save_every_n_steps: 500
  save_on_epoch_end: true
  keep_last_n: 5
  resume_from: ""

# Logging
logging:
  enable_tensorboard: false
  enable_wandb: false
  log_interval: 10

# Training hyperparameters
learning_rate: 3.0e-4
epochs: 5
gradient_accumulation: 1

# Output
output_dir: output/zimage_eri2_lokr

# Reproducibility
seed: 42
