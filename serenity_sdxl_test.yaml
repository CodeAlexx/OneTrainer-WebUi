# Serenity SDXL LoRA Config
# Tests SDXL training with parity to OneTrainer

model_type: sdxl_10_base
training_method: lora
peft_type: lora
base_model: /home/alex/.cache/huggingface/hub/models--stabilityai--stable-diffusion-xl-base-1.0/snapshots/462165984030d82259a11f4367a4eed129e94a7b

max_steps: 50
batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
train_dtype: bfloat16

concepts:
  - path: "/home/alex/datasets/AlinaAignatova"
    caption_ext: txt
    num_repeats: 1

resolution: "1024"
cache_latents: true
cache_text_embeddings: true

train_device: cuda
temp_device: cpu

optimizer:
  optimizer: adamw
  weight_decay: 0.01
lr_scheduler: constant

lora:
  rank: 16
  alpha: 16.0
  dropout: 0.0

output_dir: /home/alex/OneTrainer/output/sdxl_test
save_every: 50
output_dtype: float32

sample_every: 999999
gradient_checkpointing: "off"
seed: 42
