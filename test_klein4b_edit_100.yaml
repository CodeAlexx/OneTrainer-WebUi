# EriTrainer Klein 4B Edit LoRA 100-step Test
# Dataset: qwen_edit_test (source/target image pairs with edit instructions)

model_type: flux_2_klein_4b_edit

model:
  path: /home/alex/.cache/huggingface/hub/models--black-forest-labs--FLUX.2-klein-base-4B/snapshots/8c44a2fbef88fae175da65df054db0f901aa9747
  dtype: bfloat16

adapter:
  type: lora
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_modules: []

memory:
  strategy: noop
  gradient_checkpointing: "cpu_offloaded"
  layer_offload_fraction: 0.7

data:
  concepts:
    - /home/alex/OneTrainer/datasets/qwen_edit_test
  cache_dir: /home/alex/OneTrainer/workspace/klein4b_edit_cache
  resolution: 1024
  batch_size: 1
  num_workers: 4

sample:
  enabled: true
  interval: 50
  interval_unit: step
  sample_at_start: false
  sample_at_end: true
  prompts:
    - "edit the image to show a woman smiling"
  seeds:
    - 42
  num_inference_steps: 28
  guidance_scale: 3.5
  width: 1024
  height: 1024

checkpoint:
  output_dir: /home/alex/OneTrainer/output/klein4b_edit_100
  save_every: 100
  save_every_unit: step
  keep_last_export: 2

logging:
  enable_tensorboard: false
  enable_wandb: false
  log_interval: 10

learning_rate: 1.0e-4
epochs: 1
gradient_accumulation: 1

output_dir: /home/alex/OneTrainer/output/klein4b_edit_100

seed: 42
