# Flux Dry-Run Hardening Test
model_type: flux_dev
training_method: lora

# Use safetensors component paths
use_safetensors: true
transformer_path: /home/alex/eriui/comfyui/ComfyUI/models/diffusion_models/flux1-dev.safetensors
vae_path: /home/alex/eriui/comfyui/ComfyUI/models/vae/ae.safetensors
text_encoder_path: /home/alex/eriui/comfyui/ComfyUI/models/clip/clip_l.safetensors
text_encoder_2_path: /home/alex/eriui/comfyui/ComfyUI/models/clip/t5xxl_fp16.safetensors

# Training params
max_steps: 1
batch_size: 1
learning_rate: 0.0003
train_dtype: bfloat16

concepts:
  - path: /home/alex/datasets/liza_fresh
    num_repeats: 1

resolution: "512"
cache_latents: true
cache_text_embeddings: true

train_device: cuda
temp_device: cpu

optimizer:
  optimizer: adamw
  weight_decay: 0.01

lora:
  rank: 16
  alpha: 16.0

# Hardening Verification
gradient_checkpointing: "on"
blocks_to_swap: 60
use_experimental_memory_manager: true
debug: true
output_dir: /home/alex/OneTrainer/output/flux_hardening_test
