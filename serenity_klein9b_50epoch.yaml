# Serenity Klein 9B LoRA - Test loss fix
model_type: flux_2_klein_9b_base

model:
  path: /home/alex/.cache/huggingface/hub/models--black-forest-labs--FLUX.2-klein-base-9B/snapshots/17c3b160520b7dd44665dbf0b9ed9dd30c15cd06
  dtype: bfloat16

adapter:
  type: lora
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_modules: []

memory:
  strategy: noop
  gradient_checkpointing: "on"
  layer_offload_fraction: 0.0
  quantization: int8

data:
  concepts:
    - /home/alex/eri2
  cache_dir: /home/alex/OneTrainer/workspace/klein9b_cache
  resolution: 1024
  batch_size: 1
  num_workers: 4

sample:
  enabled: false

checkpoint:
  output_dir: /home/alex/OneTrainer/output/klein9b_test

logging:
  enable_tensorboard: false
  enable_wandb: false
  log_interval: 10

learning_rate: 3.0e-4
epochs: 1
gradient_accumulation: 1

# Noising strength control - avoid low-timestep high-variance samples
# min_noising_strength: 0.1 means timesteps start at 100/1000 instead of 0
# This matches OneTrainer's capability to control timestep range
min_noising_strength: 0.3
max_noising_strength: 1.0

output_dir: /home/alex/OneTrainer/output/klein9b_test
seed: 42
