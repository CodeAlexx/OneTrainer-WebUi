# LTX2 Test - 10 steps with sampling
model_type: ltx2

model:
  path: Lightricks/LTX-Video-0.9.7-dev
  dtype: bfloat16

data:
  concepts:
    - /home/alex/eri2
  resolution: 512
  batch_size: 1
  caption_source: txt

adapter:
  type: lora
  rank: 16
  alpha: 16

memory:
  gradient_checkpointing: "on"

optimizer:
  optimizer: adamw

scheduler:
  scheduler: constant

learning_rate: 0.0001
epochs: 1
gradient_accumulation: 1

sample:
  enabled: true
  interval: 5
  interval_unit: step
  sample_at_start: true
  num_inference_steps: 10
  guidance_scale: 5.0
  width: 512
  height: 512
  prompts:
    - "a cat walking"
  seeds:
    - 42

checkpoint:
  save_every: 100
  save_every_unit: step
  output_dir: output/ltx2_sample_test
seed: 42
